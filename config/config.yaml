artifacts_root: artifacts


data_ingestion:
  bucket_name   : 'predict-bot-mlops-2026'
  file_name     : 'raw-master-data/Cloud_fare_Master_data.csv'
  raw_data      : artifacts/data_ingestion/raw_data
  ingested_data : artifacts/data_ingestion/ingested_data

data_validation:
  # --- paths ---
  raw_data_folder : "artifacts/data_ingestion/raw_data/Cloud_fare_Master_data.csv"
  validated_data  : "artifacts/data_validation/validated/"
  quarantine_data : "artifacts/data_validation/quarantine/"
  log_path        : "artifacts/data_validation/logs/log.json"

  # --- step 1 : schema ---
  expected_columns:
    - timestamp
    - bot_score

  expected_dtypes:
    timestamp : "datetime64[ns, UTC]"
    bot_score : "float64"

  # --- step 2 : data quality ---
  missing_thresholds:
    timestamp : 0.00        # zero nulls allowed ever
    bot_score : 0.00        # zero nulls allowed ever

  duplicate_timestamps: false   # no duplicate timestamps allowed

  volume:
    min_rows  : 96            # minimum 1 full day of data
    max_rows  : 50000         # safety ceiling
    expected  : 40705         # your full master dataset size

  # --- step 3 : temporal ---
  temporal:
    interval_minutes  : 15      # every row must be exactly 15 min apart
    max_gap_count     : 0       # zero missing intervals allowed
    require_sorted    : true    # timestamp must be ascending

  # --- step 4 : statistical ---
  statistical:
    baseline_mean     : 0.81    # df['bot_score'].mean()  from your EDA
    baseline_std      : 0.09    # df['bot_score'].std()   from your EDA
    drift_factor      : 2.0     # alert if mean shifts by > 2 * baseline_std
    min_std           : 0.001   # flag if all values are suspiciously identical

  # --- step 5 : feature validation ---
  range_checks:
    bot_score:
      min : 0.0
      max : 1.0

  outlier_floor     : 0.50      # 1st percentile from your EDA (np.percentile = 0.536)
  max_step_drop     : 0.20      # max allowed drop between two consecutive rows

  # --- step 6 : business logic ---
  business_logic:
    allow_cold_start      : true    # first row = 1.0 is valid (your data starts at 1.0)
    known_anomaly_score   : 0.0     # rows with exactly 0.0 → hard quarantine (Aug 2025)
    max_identical_pct     : 0.50    # flag if >50% rows share the same score
    rolling_mean_floor    : 0.65    # 24hr rolling mean should never go below this
    rolling_window        : 96      # 96 x 15min = 24 hours

  # --- outcome routing ---
  hard_fail_checks:               # these → quarantine_data + log
    - schema
    - data_quality

  soft_fail_checks:               # these → validated_data + log warning
    - temporal
    - statistical
    - feature_validation
    - business_logic  

data_transformation:
  validated_data_path : 'artifacts/data_validation/validated/validated.csv'
  transformed_data: 'artifacts/data_transformation/transformed_data' 

feature_engineering:
  transformed_data_path : "artifacts/data_transformation/transformed_data/"
  featured_data_dir     : "artifacts/feature_engineering/featured"
  featured_raw_data     : "artifacts/feature_engineering/featured/featured_raw_data"
  train_data            : "artifacts/feature_engineering/featured/train_data"
  test_data             : "artifacts/feature_engineering/featured/test_data"
  validation_data       : "artifacts/feature_engineering/featured/Validation_data"

  features:
    - lag_1
    - lag_2
    - lag_3
    - lag_4
    - lag_96
    - rolling_std_4
    

  lag_columns:
    lag_1  : 1
    lag_2  : 2
    lag_3  : 3
    lag_4  : 4
    lag_96 : 96

  rolling:
    rolling_std_4 : 4

  target_column : "bot_score"

model_training:
  train_data_path : "artifacts/feature_engineering/featured/train_data/"
  val_data_path   : "artifacts/feature_engineering/featured/Validation_data/"
  test_data_path  : "artifacts/feature_engineering/featured/test_data/"
  model_dir       : "artifacts/Model_Building"

  active_model_strategy : "best_of_k"

  models:
    lightgbm:
      type   : "lightgbm"
      params :
        objective         : "regression"
        metric            : "mae"
        n_estimators      : 2000
        learning_rate     : 0.01
        num_leaves        : 63
        max_depth         : 8
        min_child_samples : 30
        subsample         : 0.9
        colsample_bytree  : 0.9
        reg_alpha         : 0.5
        reg_lambda        : 0.5
        random_state      : 42
        verbose           : -1

    xgboost:
      type   : "xgboost"
      params :
        objective        : "reg:absoluteerror"
        n_estimators     : 2000
        learning_rate    : 0.01
        max_depth        : 8
        subsample        : 0.9
        colsample_bytree : 0.9
        reg_alpha        : 0.5
        reg_lambda       : 0.5
        random_state     : 42
        verbosity        : 0

    baseline:
      type   : "baseline"
      params : {}

  features:
    - lag_1
    - lag_2
    - lag_3
    - lag_4
    - lag_96
    - rolling_std_4

  target_column : "bot_score"
  baseline_mae  : 0.0199

  promotion_criteria:
    primary_metric                : "mae"
    min_improvement_over_baseline : 0.08
    mlflow_registry_name          : "predict-bot-champion"

  mlflow:
    experiment_name : "predict-bot-training-v1"
    tracking_uri    : "sqlite:///mlflow.db"

model_evaluation:
  test_data_path      : "artifacts/feature_engineering/featured/test_data/"
  validation_data_path: "artifacts/feature_engineering/featured/Validation_data/"
  model_dir           : "artifacts/Model_Building/"
  model_eval_dir      : "artifacts/Model_evaluation/"
  champion_path       : "artifacts/Model_evaluation/champion.pkl"
  model_eval_results  : "artifacts/Model_evaluation/evaluation_results/"

  features:
    - lag_1
    - lag_2
    - lag_3
    - lag_4
    - lag_96
    - rolling_std_4

  target_column        : "bot_score"
  baseline_feature     : "lag_1"
  baseline_mae         : 0.0199
  improvement_threshold: 0.08        # 8% improvement required
  champion_threshold   : 0.05        # 5% better than champion to promote
  spike_threshold      : 0.60        # bot_score below this = spike row

  mlflow:
    experiment_name : "predict-bot-training-v1"
    tracking_uri    : "sqlite:///mlflow.db"

s3_config:
  bucket_name : predict-bot-mlops-2026